name: Build and Deploy CV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate LaTeX sources and portfolio data
        run: ./gradlew run

      - name: Compile LaTeX (LuaLaTeX)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          working_directory: build/latex
          latexmk_use_lualatex: true

      - name: Prepare Pages content
        run: |
          cp -r web build/site
          cp build/latex/cv.pdf build/site/cv.pdf
          cp build/latex/photo.jpg build/site/photo.jpg
          cp build/cv-data.json build/site/cv-data.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/site
