<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anatolii Anishchenko — Portfolio</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="sidebar-overlay" onclick="closeSidebar()"></div>

  <header id="app-header">
    <div style="display:flex;align-items:center;gap:.6rem">
      <button class="menu-btn" id="menu-btn" onclick="toggleSidebar()" title="Sections">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="h-identity">
        <h1 id="h-name">Anatolii Anishchenko</h1>
        <p  id="h-tagline">Java / Kotlin Software Engineer</p>
      </div>
    </div>
    <div class="view-toggle">
      <button class="toggle-btn" data-mode="portfolio" onclick="setMode('portfolio')">Portfolio</button>
      <button class="toggle-btn" data-mode="pdf"       onclick="setMode('pdf')">CV</button>
    </div>
    <div class="h-actions">
      <span id="zoom-controls" style="display:none;align-items:center;gap:.35rem">
        <button class="zoom-btn" id="zoom-out" onclick="zoomChange(-1)" title="Zoom out">−</button>
        <span   class="zoom-label" id="zoom-label">100%</span>
        <button class="zoom-btn" id="zoom-in"  onclick="zoomChange(1)"  title="Zoom in">+</button>
      </span>
      <a class="download-btn" href="cv.pdf" download="AnishchenkoAA_CV.pdf">
        <i class="fa-solid fa-download"></i> PDF
      </a>
    </div>
  </header>

  <!-- ── PDF view ─────────────────────────────────────────────────────────── -->
  <div id="pdf-view" class="view-panel hidden">
    <div id="viewer-container">
      <span id="pdf-loading">Loading…</span>
    </div>
  </div>

  <!-- ── Portfolio view ───────────────────────────────────────────────────── -->
  <div id="portfolio-view" class="view-panel hidden">
    <aside id="sidebar"></aside>
    <div id="content-area">
      <div id="section-display"></div>
      <div id="section-nav-bar">
        <button class="nav-btn" id="prev-btn" onclick="navigate(-1)">
          <i class="fa-solid fa-chevron-left"></i> Previous
        </button>
        <span class="nav-indicator" id="nav-indicator"></span>
        <button class="nav-btn" id="next-btn" onclick="navigate(1)">
          Next <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>
    </div>
  </div>

  <footer>
    Auto-compiled from LaTeX source via GitHub Actions &amp; deployed to GitHub Pages.
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="app.js"></script>
  <script src="portfolio.js"></script>
  <script src="pdf-viewer.js"></script>
  <script>init();</script>

</body>
</html>
