# Single source of truth for build-tool versions used by every module.
[versions]
java = "21"
kotlin = "2.2.20"
detekt = "2.0.0-alpha.5"
cv-dsl = "0.1.0-SNAPSHOT"

[libraries]
cv-dsl = { module = "cv.dsl:cv-dsl", version.ref = "cv-dsl" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
